version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: change-root-password
      MYSQL_DATABASE: ordercount
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app123456
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql

  app:
    build: .
    restart: always
    ports:
      - "8081:8080"
    environment:
      # 与 README 中示例一致的 DSN，指向上面的 db 服务
      MYSQL_DSN: "appuser:app123456@tcp(db:3306)/ordercount?charset=utf8mb4&parseTime=True&loc=Local"
      # 生产模式 + 强制使用自定义 JWT 密钥
      APP_ENV: "prod"
      JWT_SECRET: "jN2p5uC8!kL0xQ7zR9tV3bY6wH1@eF4"
    depends_on:
      - db

volumes:
  db-data:
